name: ci

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: tty-pt/ci/.github/workflows/all-in-one.yml@main
    with:
      name: axil-hyle
      deps: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth"
      deps_openbsd: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth,json-c"
      deps_deb: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth,libjson-c-dev"
      deps_apk: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth,json-c-dev"
      deps_rpm: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth,json-c-devel"
      deps_pacman: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth,json-c"
      deps_brew: "axil,libstele,libcorm,libxylem,libhyle,libhyle-source,axil-auth,json-c"
      publish_to: "deb,apk,rpm,pacman,brew,openbsd"
    secrets: inherit
